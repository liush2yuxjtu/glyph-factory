name: 游戏验证与发布
on:
  push:
    branches: [main]
    paths:
      - public/play.html
      - public/glyph-engine-v3.js
      - public/glyph-game-v3.js
      - public/player-privacy-v3.js
      - public/preview.html
      - public/intent.html
      - public/glyph-factory-v3-preview.webm
      - src/app/GameShell.tsx
      - tests/**
      - scripts/build-static.mjs
      - docs/design/aha-moments-internal.zh-CN.md
      - docs/development/aha-spoiler-boundary.md
      - vercel.json
      - .github/workflows/game.yml
  pull_request:
    paths:
      - public/play.html
      - public/glyph-engine-v3.js
      - public/glyph-game-v3.js
      - public/player-privacy-v3.js
      - public/preview.html
      - public/intent.html
      - public/glyph-factory-v3-preview.webm
      - src/app/GameShell.tsx
      - tests/**
      - scripts/build-static.mjs
      - docs/design/aha-moments-internal.zh-CN.md
      - docs/development/aha-spoiler-boundary.md
      - vercel.json
      - .github/workflows/game.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glyph-game-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Acts Engine v3 玩家构建与内部评审资产校验
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 验证核心机制、渐进揭示与 spoiler boundary
        run: node --test tests/*.test.mjs
      - name: 安装内部视频验证工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
      - name: 验证内部评审 WebM 源文件
        run: |
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/glyph-factory-v3-preview.webm)"
          echo "Internal review video duration: ${duration}s"
          node -e "const d=Number(process.argv[1]); if (!Number.isFinite(d) || d < 20) { console.error('Internal review video must decode and be at least 20 seconds; got', process.argv[1]); process.exit(1); }" "$duration"
      - name: 构建玩家安全静态包
        run: node scripts/build-static.mjs
      - name: 检查 Vercel 部署授权
        id: auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '测试与构建已完成，但仓库没有 VERCEL_TOKEN；跳过显式部署。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 发布 PR Player Preview 到 Vercel
        if: github.event_name == 'pull_request' && steps.auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@59.16.0 deploy --yes --name glyph-factory --scope nyn5255-8475s-projects --token "$VERCEL_TOKEN" > deployment-url.txt
          printf '\nPR Player Preview URL：\n' >> "$GITHUB_STEP_SUMMARY"
          cat deployment-url.txt >> "$GITHUB_STEP_SUMMARY"
      - name: 发布 main 到 Vercel Production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@59.16.0 deploy --yes --prod --name glyph-factory --scope nyn5255-8475s-projects --token "$VERCEL_TOKEN" > deployment-url.txt
          printf '\nProduction URL：\n' >> "$GITHUB_STEP_SUMMARY"
          cat deployment-url.txt >> "$GITHUB_STEP_SUMMARY"
