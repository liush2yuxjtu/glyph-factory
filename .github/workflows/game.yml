name: 游戏验证与发布
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glyph-game-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: Fast engine and player-build contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the same fast gate used locally
        shell: bash
        run: node scripts/verify-player.mjs --fast 2>&1 | tee verification-fast.log
      - name: Build the separate internal review artifact
        run: node scripts/build-aha-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aha-review-${{ github.sha }}
          path: review-dist/
          if-no-files-found: error
          retention-days: 7
      - name: Validate internal review video without deploying it
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg >/dev/null
          fi
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/glyph-factory-v3-preview.webm)"
          node -e "const d=Number(process.argv[1]); if (!Number.isFinite(d) || d < 20) process.exit(1);" "$duration"
      - uses: actions/upload-artifact@v4
        with:
          name: player-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-test-results
          path: verification-fast.log
          retention-days: 7

  browser:
    name: Player regression (${{ matrix.browser }})
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/browser/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: player-build-${{ github.sha }}
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: aha-review-${{ github.sha }}
          path: review-dist/
      - name: Install pinned browser tooling
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise the exact player artifact (no retries)
        shell: bash
        env:
          GLYPH_BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          python scripts/run-browser-contracts.py player 2>&1 | tee browser-results.log
          python scripts/run-browser-contracts.py aha 2>&1 | tee aha-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-regression-${{ matrix.browser }}
          path: |
            test-results/
            browser-results.log
            aha-results.log
          retention-days: 7

  merge_gate:
    name: Player merge gate
    if: ${{ always() }}
    needs: [fast, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject failed, cancelled or skipped required checks
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$BROWSER_RESULT" = success
          echo "Player contracts verified for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy verified player build
    needs: merge_gate
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment authorization
        id: auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No VERCEL_TOKEN: explicit deployment skipped. Git integration preview is separate from the merge gate.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish verified PR preview
        if: github.event_name == 'pull_request' && steps.auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@59.16.0 deploy --yes --name glyph-factory --scope nyn5255-8475s-projects --token "$VERCEL_TOKEN" > deployment-url.txt
          cat deployment-url.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified main production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@59.16.0 deploy --yes --prod --name glyph-factory --scope nyn5255-8475s-projects --token "$VERCEL_TOKEN" > deployment-url.txt
          cat deployment-url.txt >> "$GITHUB_STEP_SUMMARY"
