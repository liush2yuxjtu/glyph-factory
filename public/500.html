<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17201a">
<title>暂时无法打开 · 字工厂</title>
<style>
:root{--ink:#17201a;--paper:#efe9d8;--panel:#fffaf0;--green:#c8ef70;--muted:#657064}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#cfd4c2;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.card{width:min(560px,calc(100% - 32px));background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:32px}.stamp{width:58px;height:62px;display:grid;place-items:center;background:var(--ink);color:var(--green);font:900 36px/1 serif}.eyebrow{margin:18px 0 4px;font-size:11px;font-weight:800;letter-spacing:.12em}.card h1{margin:0;font-size:clamp(30px,8vw,48px);line-height:1.1}.card p{color:var(--muted);margin:12px 0 24px}.card a{display:inline-flex;min-height:44px;align-items:center;padding:9px 14px;border:2px solid var(--ink);background:var(--green);color:var(--ink);font-weight:800;text-decoration:none;box-shadow:3px 3px 0 var(--ink)}.card a:focus-visible{outline:3px solid #a34e34;outline-offset:4px}
</style>
</head>
<body><main class="card"><div class="stamp" aria-hidden="true">字</div><p class="eyebrow">字//工厂</p><h1>工坊暂时打不开。</h1><p>请返回工坊首页后再试一次。</p><a href="/">返回字工厂</a></main></body>
</html>
