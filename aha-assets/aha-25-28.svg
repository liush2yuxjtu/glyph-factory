        <rect width="430" height="34" rx="7" class="bar"/><text x="15" y="23" class="brand">Glyph Factory</text>
        <rect x="16" y="52" width="94" height="154" class="sidebar"/>
        <text x="31" y="76" class="nav">Workshop</text><text x="31" y="104" class="nav">Inventory</text><text x="31" y="132" class="nav">Research</text><text x="31" y="160" class="nav">Map</text>
        <text x="130" y="79" class="panel">LIBRARY</text><text x="130" y="112" class="line">More language = more capacity</text><text x="130" y="147" class="line">Total glyphs 1,240</text><text x="130" y="182" class="line">Write More</text>
      </g>
      <g transform="translate(485 119)"><text x="115" y="0" text-anchor="middle" class="action">Confront ambiguity</text><path d="M15 64 H190" class="arrow"/><polygon points="190,50 220,64 190,78" class="arrowfill"/></g>
      <g transform="translate(732 84)">
        <rect width="430" height="228" rx="7" class="screen"/>
        <rect width="430" height="34" rx="7" class="bar"/><text x="15" y="23" class="brand">Glyph Factory</text>
        <rect x="16" y="52" width="94" height="154" class="sidebar active"/>
        <text x="31" y="76" class="nav">System</text><text x="31" y="104" class="nav">Metrics</text><text x="31" y="132" class="nav">World</text><text x="31" y="160" class="nav">Archive</text>
        <text x="130" y="79" class="panel">INTERPRETATION MAP</text><text x="130" y="112" class="line">Ambiguity 312</text><text x="130" y="147" class="line">Aligned 52% · Uncertain 31%</text><text x="130" y="182" class="line">Conflicting 17%</text>
      </g>
      <text x="600" y="338" text-anchor="middle" class="out">Ambiguity isn’t a bug. It’s a system.</text>
    </g><g transform="translate(0 905)">
