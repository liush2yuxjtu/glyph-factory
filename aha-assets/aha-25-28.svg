        <rect width="430" height="34" rx="7" class="bar"/><text x="15" y="23" class="brand">Glyph Factory</text>
        <rect x="16" y="52" width="94" height="154" class="sidebar active"/>
        <text x="31" y="76" class="nav">System</text><text x="31" y="104" class="nav">Metrics</text><text x="31" y="132" class="nav">World</text><text x="31" y="160" class="nav">Archive</text>
        <text x="130" y="79" class="panel">SYSTEM CLEANUP</text><text x="130" y="112" class="line">Duplicate ideas 12,420</text><text x="130" y="147" class="line">Outdated 8,317 · spam 3,802</text><text x="130" y="182" class="line">Entropy 22% · Delete Selected</text>
      </g>
      <text x="600" y="338" text-anchor="middle" class="out">Progress isn’t always more. Sometimes it’s less.</text>
    </g><g transform="translate(0 1295)">
      <rect x="20" y="0" width="1160" height="360" rx="12" class="row"/>
      <rect x="38" y="22" width="72" height="42" rx="6" class="idbox"/><text x="74" y="51" class="id" text-anchor="middle">A28</text>
