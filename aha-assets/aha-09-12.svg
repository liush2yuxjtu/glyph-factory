        <rect x="16" y="52" width="94" height="154" class="sidebar active"/>
        <text x="31" y="76" class="nav">System</text><text x="31" y="104" class="nav">Metrics</text><text x="31" y="132" class="nav">World</text><text x="31" y="160" class="nav">Archive</text>
        <text x="130" y="79" class="panel">WORD PROPAGATION</text><text x="130" y="112" class="line">Reach 48,320</text><text x="130" y="147" class="line">Mentions +320%</text><text x="130" y="182" class="line">Reproduction 2.8×</text>
      </g>
      <text x="600" y="338" text-anchor="middle" class="out">The key variable shifts from production speed to transmission speed.</text>
