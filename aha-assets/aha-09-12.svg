        <text x="31" y="76" class="nav">Workshop</text><text x="31" y="104" class="nav">Inventory</text><text x="31" y="132" class="nav">Research</text><text x="31" y="160" class="nav">Map</text>
        <text x="130" y="79" class="panel">LANGUAGE OVERVIEW</text><text x="130" y="112" class="line">“home” = one meaning</text><text x="130" y="147" class="line">Global usage 100%</text><text x="130" y="182" class="line">Same everywhere</text>
      </g>
