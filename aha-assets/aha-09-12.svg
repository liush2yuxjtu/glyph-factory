        <text x="31" y="76" class="nav">System</text><text x="31" y="104" class="nav">Metrics</text><text x="31" y="132" class="nav">World</text><text x="31" y="160" class="nav">Archive</text>
        <text x="130" y="79" class="panel">CLARITY ANALYSIS</text><text x="130" y="112" class="line">Noise −62%</text><text x="130" y="147" class="line">Clarity +180%</text><text x="130" y="182" class="line">Signal +250% · Value +86</text>
      </g>
      <text x="600" y="338" text-anchor="middle" class="out">What not to write becomes as important as what to write.</text>
