<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1720" role="img" aria-label="Glyph Factory Aha flows 13–16">
  <style>
  .bg{fill:#f3eedf}.row{fill:#f8f2e4;stroke:#c5bdab;stroke-width:2}.screen{fill:#fffaf0;stroke:#173125;stroke-width:2}.bar{fill:#184d38}.sidebar{fill:#ece5d3;stroke:#d5cdb9}.sidebar.active{fill:#dbe8cd}.idbox{fill:#235b43}.id{font:700 25px Georgia,serif;fill:#fff}.title{font:700 29px Georgia,serif;fill:#172019}.brand{font:700 17px Georgia,serif;fill:#fff}.nav{font:14px system-ui;fill:#365342}.panel{font:700 18px Georgia,serif;fill:#172019}.line{font:15px system-ui;fill:#4f5f55}.action{font:700 18px Georgia,serif;fill:#172019}.arrow{stroke:#3b7455;stroke-width:14}.arrowfill{fill:#3b7455}.out{font:italic 700 18px Georgia,serif;fill:#245b42}.h1{font:700 42px Georgia,serif;fill:#173125}.sub{font:17px system-ui;fill:#526158}
  </style><rect class="bg" width="1200" height="1720"/><text x="28" y="58" class="h1">Glyph Factory — Standalone Aha Flows 13–16</text><text x="30" y="91" class="sub">Each Aha is a standalone Before → Action → After visual flow.</text><g transform="translate(0 125)">
