        <text x="31" y="76" class="nav">System</text><text x="31" y="104" class="nav">Metrics</text><text x="31" y="132" class="nav">World</text><text x="31" y="160" class="nav">Archive</text>
        <text x="130" y="79" class="panel">CITY · CONCEPTS AT WORK</text><text x="130" y="112" class="line">Green Living +Health</text><text x="130" y="147" class="line">Shared Spaces +Community</text><text x="130" y="182" class="line">Creative District +Innovation</text>
