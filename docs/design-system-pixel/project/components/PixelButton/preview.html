<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>PixelButton</title>
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-pixel);-webkit-font-smoothing:none}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;padding:16px}.cap{font-size:12px;color:var(--ink-muted);display:block;margin-top:8px}.gp-btn{max-width:330px}</style></head>
<body><div id="root" class="row"></div>
<script>var G=window.GlyphPixel,r=document.getElementById('root');r.innerHTML=[
 G.button({l:'印字',s:'手动生产',m:true}),
 G.button({l:'刻模：木 + 木 → 林',s:'已刻 81 条 · 读者 +0.18/秒'}),
 G.button({l:'一封没署名的信',s:'花掉 库存字 30',e:true}),
 G.button({l:'停止印刷',s:'还差 歧义（2.2K / 4.8K）',x:true}),
 G.button({l:'发行新一期',s:'还差 意义（12 / 30）',m:true,d:true}),
 G.button({l:'删除噪音',s:'还差 纸张危机（0 / 1）',d:true})].join('');</script>
</body></html>
