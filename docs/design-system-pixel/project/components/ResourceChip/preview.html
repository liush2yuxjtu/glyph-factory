<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>ResourceChip</title>
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-pixel);-webkit-font-smoothing:none}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;padding:16px}.cap{font-size:12px;color:var(--ink-muted);display:block;margin-top:8px}</style></head>
<body><div id="root" class="row"></div>
<script>var G=window.GlyphPixel,r=document.getElementById('root');r.innerHTML=[['库存文字','55.8K'],['工坊资金','309.5'],['读者','218'],['意义','12'],['噪音','34.4']].map(function(x){return G.chip(x[0],x[1])}).join('');</script>
</body></html>
