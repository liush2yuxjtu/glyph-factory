<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>PixelIcon</title>
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-pixel);-webkit-font-smoothing:none}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;padding:16px}.cap{font-size:12px;color:var(--ink-muted);display:block;margin-top:8px}.gp-sprite{margin:0 auto}</style></head>
<body><div id="root" class="row"></div>
<script>var G=window.GlyphPixel,r=document.getElementById('root');r.innerHTML=G.sprites.map(function(n){return '<div style="text-align:center;width:64px">'+G.sprite(n,48)+'<span class=cap>'+n+'</span></div>'}).join('');</script>
</body></html>
